# Stack aislado de Leads OSINT. NO toca el n8n de producción.
# Uso: WORKER_KEY=... N8N_NETWORK=<red docker de tu n8n> docker compose -f docker-compose.leads.yml up -d --build
# Búsqueda extra (SearXNG): añade --profile search
services:
  lead-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_KEY: ${WORKER_KEY:?define WORKER_KEY}
      GOSOM_URL: ${GOSOM_URL:-http://gosom:8080}
      MAPS_KIT_URL: ${MAPS_KIT_URL:-http://maps-kit:8080}
      EXTERNAL_TIMEOUT: ${EXTERNAL_TIMEOUT:-20}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    networks: [n8n_net]
    # sin "ports": solo accesible desde la red de n8n como http://lead-worker:8000

  searxng:
    profiles: ["search"]
    image: searxng/searxng:latest
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    networks: [n8n_net]

  gosom:
    profiles: ["maps"]
    image: ${GOSOM_IMAGE:?define GOSOM_IMAGE with a pinned gosom image tag}
    command: ["-data-folder", "/data"]
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 300
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    volumes:
      - gosom_data:/data
      - gosom_cache:/opt
    expose: ["8080"]
    networks: [n8n_net]

  maps-kit:
    profiles: ["maps"]
    build:
      context: ./integrations/maps-kit
      args:
        KIT_REF: ${KIT_REF:?define KIT_REF with a pinned kit commit or tag}
    environment:
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
      SCRAPER_NO_UPDATE_CHECK: "1"
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 300
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    volumes:
      - maps_kit_data:/kit/.engine/data
    expose: ["8080"]
    networks: [n8n_net]

networks:
  n8n_net:
    external: true
    name: ${N8N_NETWORK:?define N8N_NETWORK (docker network ls)}

volumes:
  gosom_data:
  gosom_cache:
  maps_kit_data:

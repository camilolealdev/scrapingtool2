<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="lens" x1="12" y1="12" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Magnifying glass circle -->
  <circle cx="26" cy="26" r="13" stroke="url(#lens)" stroke-width="4" fill="#0d0f1a" filter="url(#glow)"/>

  <!-- Crosshair inside lens -->
  <line x1="26" y1="17" x2="26" y2="21" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="31" x2="26" y2="35" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="26" x2="21" y2="26" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="31" y1="26" x2="35" y2="26" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="26" cy="26" r="3.5" fill="#00e5ff" opacity="0.9"/>

  <!-- Handle -->
  <line x1="36" y1="36" x2="50" y2="50" stroke="url(#lens)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Small data dots (leads) -->
  <circle cx="50" cy="14" r="2.5" fill="#00e5ff" opacity="0.7"/>
  <circle cx="56" cy="22" r="1.5" fill="#0066ff" opacity="0.6"/>
  <circle cx="52" cy="8"  r="1.5" fill="#00e5ff" opacity="0.5"/>
</svg>
